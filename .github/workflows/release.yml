name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: omd2typst-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: omd2typst-macos-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: omd2typst-macos-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: omd2typst-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p omd2typst

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release omd2typst

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/omd2typst.exe -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Extract release notes
        run: |
          python3 - <<'PYEOF' > notes.md
          import re
          tag = "${{ github.ref_name }}"
          content = open('RELEASE_NOTES.md').read()
          pattern = rf'## {re.escape(tag)} .+?\n(.*?)(?=\n---|\n## v|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          print(match.group(1).strip() if match else '')
          PYEOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release only if it does not already exist.
          # A release may be pre-created manually (e.g. to attach a WASM artifact
          # before CI runs), in which case we skip creation and just upload binaries.
          if ! gh release view ${{ github.ref_name }} --repo ${{ github.repository }} > /dev/null 2>&1; then
            gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "${{ github.ref_name }}" \
              --notes-file notes.md
          fi

          # Upload binaries — --clobber overwrites if assets already exist (safe re-run).
          gh release upload ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --clobber \
            omd2typst-linux-x86_64.tar.gz \
            omd2typst-macos-arm64.tar.gz \
            omd2typst-macos-x86_64.tar.gz \
            omd2typst-windows-x86_64.zip
