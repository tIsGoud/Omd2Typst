[package]
name = "omd2typst"
version = "0.19.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Convert Obsidian Markdown notes to Typst/PDF via an AST pipeline"

[[bin]]
name = "omd2typst"
path = "src/main.rs"

[dependencies]
omd2typst-core = { path = "../core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
# Page counts of embedded PDFs (Typst cannot count them); already part of Typst's PDF image support.
hayro-syntax = "0.7"
