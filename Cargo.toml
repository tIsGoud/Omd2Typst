[workspace]
members = ["crates/core", "crates/cli", "crates/wasm", "crates/web"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.70"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true

[patch.crates-io]
# Adds "liberation sans" before "libertinus serif" in the hardcoded font fallback list
# (families() in typst-library/src/text/mod.rs) so that our embedded Liberation Sans
# is preferred over the serif Libertinus Serif when a template's font is unavailable.
typst-library = { path = "patches/typst-library" }
